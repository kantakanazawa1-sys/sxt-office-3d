function rackPx(px,pz,wmm,dmm,hmm,rot=0){const w=wmm/1000,d=dmm/1000,h=hmm/1000;for(const sx of[-1,1])for(const sz of[-1,1])box(X(px)+sx*(w/2-.025),Z(pz)+sz*(d/2-.025),.04,.04,h,mats.rack,h/2);for(let i=0;i<5;i++)box(X(px),Z(pz),w,d,.035,i*h/4+.03,mats.wood)}

function beam(x1,z1,x2,z2,underside,depth=.30){const ax=X(x1),az=Z(z1),bx=X(x2),bz=Z(z2),len=Math.hypot(bx-ax,bz-az);const h=depth,m=box((ax+bx)/2,(az+bz)/2,len,.18,h,mats.wall,underside+h/2);m.rotation.y=-Math.atan2(bz-az,bx-ax)}
